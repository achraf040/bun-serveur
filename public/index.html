<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Serveur Bun</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f5; }
    button { font-size: 1.2rem; padding: 0.8rem 1.6rem; border: none; border-radius: 8px;
             background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #resultat { margin-top: 1.5rem; font-size: 1.1rem; }
    .ok { color: #16a34a; } .erreur { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Serveur Bun</h1>
  <button id="tester">Tester le serveur</button>
  <div id="resultat"></div>
  <script>
    document.getElementById("tester").addEventListener("click", async () => {
      const r = document.getElementById("resultat");
      r.textContent = "Test en cours...";
      r.className = "";
      try {
        const debut = performance.now();
        const res = await fetch("/api/health");
        const data = await res.json();
        const ms = Math.round(performance.now() - debut);
        r.textContent = "✅ Le serveur fonctionne ! (" + ms + " ms) — " + data.heure;
        r.className = "ok";
      } catch (e) {
        r.textContent = "❌ Le serveur ne répond pas.";
        r.className = "erreur";
      }
    });
  </script>
</body>
</html>
